name: "Checkout (retry) + optional init trex submodules"
description: >
  Standard checkout dance used across trex workflows: `actions/checkout@v4`
  with a one-shot retry on transient failure, then optionally
  `./.github/actions/checkout-trex` to init the requested submodules.
  Defaults to initializing just `plugins/extension-ci-tools` since that's
  what most build/test jobs need. Set `submodule-paths: ''` to skip the
  submodule init for jobs that don't need it (lint, trexsql-jar, ...).
inputs:
  submodule-paths:
    description: "Space-separated submodule paths to init. Set to '' to skip."
    required: false
    default: "plugins/extension-ci-tools"
  fetch-depth:
    description: "actions/checkout fetch-depth (defaults to 1)."
    required: false
    default: "1"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      id: co_checkout
      continue-on-error: true
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - if: steps.co_checkout.outcome == 'failure'
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - if: inputs.submodule-paths != ''
      uses: ./.github/actions/checkout-trex
      with:
        paths: ${{ inputs.submodule-paths }}
