name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [main, develop]
  merge_group:
  workflow_dispatch:
    inputs:
      d2e_branch:
        description: "D2E branch to test against (for the e2e-d2e job)"
        default: "develop"
        type: string

# read-all suffices for the build/test matrix; the e2e-d2e job overrides this
# to grant checks/pull-requests:write needed by ctrf-io/github-test-reporter.
permissions: read-all

concurrency:
  group: integration-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Layer 1: Build Jobs (all run in parallel)
  # ===========================================================================

  build-pool:
    name: "Build pool"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/pool/target
          key: pool-${{ runner.os }}-${{ hashFiles('plugins/pool/Cargo.lock') }}
          restore-keys: pool-${{ runner.os }}-

      - name: Build pool
        run: make configure && make debug_coverage
        working-directory: plugins/pool

      - uses: actions/upload-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/pool.trex
          retention-days: 1

  build-rust-core:
    name: "Build db"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/db/target
          key: rust-core-${{ runner.os }}-${{ hashFiles('plugins/db/Cargo.lock') }}
          restore-keys: rust-core-${{ runner.os }}-

      - name: Build db
        run: make configure && make debug_coverage
        working-directory: plugins/db

      - uses: actions/upload-artifact@v4
        with:
          name: ext-db
          path: plugins/db/build/debug/extension/db/db.trex
          retention-days: 1

  build-pg-trex:
    name: "Build pg_trex"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install PostgreSQL 17 dev headers
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17

      - uses: ./.github/actions/setup-libtrexsql
        with:
          version: v1.4.4-trex

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.pgrx
            plugins/pg_trex/target
          key: rust-pg-trex-${{ runner.os }}-${{ hashFiles('plugins/pg_trex/Cargo.lock') }}
          restore-keys: rust-pg-trex-${{ runner.os }}-

      - name: Install cargo-pgrx and init
        run: |
          cargo install cargo-pgrx --version 0.16.1 --locked
          cargo pgrx init --pg17=$(which pg_config)

      - name: Build pg_trex
        run: LIBRARY_PATH=/tmp/trexsql cargo build
        working-directory: plugins/pg_trex

      - uses: actions/upload-artifact@v4
        with:
          name: pg-trex-build
          path: plugins/pg_trex/target/debug/libpg_trex.so
          retention-days: 1

  build-pgwire:
    name: "Build pgwire"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/pgwire/target
          key: rust-pgwire-${{ runner.os }}-${{ hashFiles('plugins/pgwire/Cargo.lock') }}
          restore-keys: rust-pgwire-${{ runner.os }}-

      - name: Build pgwire
        run: make configure && make debug_coverage
        working-directory: plugins/pgwire

      - uses: actions/upload-artifact@v4
        with:
          name: ext-pgwire
          path: plugins/pgwire/build/debug/extension/pgwire/pgwire.trex
          retention-days: 1

  build-chdb:
    name: "Build chdb"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install chdb native library
        run: sudo apt-get update && sudo apt-get install -y libc6-dev clang && sudo bash ./install_chdb.sh
        working-directory: plugins/chdb

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/chdb/target
          key: rust-chdb-${{ runner.os }}-${{ hashFiles('plugins/chdb/Cargo.lock') }}
          restore-keys: rust-chdb-${{ runner.os }}-

      - name: Build chdb
        run: make configure && make debug_coverage
        working-directory: plugins/chdb

      - uses: actions/upload-artifact@v4
        with:
          name: ext-chdb
          path: plugins/chdb/build/debug/extension/chdb/chdb.trex
          retention-days: 1

  build-hana:
    name: "Build hana"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/hana/target
          key: rust-hana-${{ runner.os }}-${{ hashFiles('plugins/hana/Cargo.lock') }}
          restore-keys: rust-hana-${{ runner.os }}-

      - name: Build hana
        run: make configure && make debug_coverage
        working-directory: plugins/hana

      - uses: actions/upload-artifact@v4
        with:
          name: ext-hana
          path: plugins/hana/build/debug/extension/hana_scan/hana_scan.trex
          retention-days: 1

  build-tpm:
    name: "Build tpm"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/tpm/target
          key: rust-tpm-${{ runner.os }}-${{ hashFiles('plugins/tpm/Cargo.lock') }}
          restore-keys: rust-tpm-${{ runner.os }}-

      - name: Build tpm
        run: make configure && make debug_coverage
        working-directory: plugins/tpm

      - uses: actions/upload-artifact@v4
        with:
          name: ext-tpm
          path: plugins/tpm/build/debug/extension/tpm/tpm.trex
          retention-days: 1

  build-trexas:
    name: "Build trexas"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools plugins/runtime/trex-runtime"

      - uses: dtolnay/rust-toolchain@stable

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/runtime/target
          key: rust-trexas-${{ runner.os }}-${{ hashFiles('plugins/runtime/Cargo.lock') }}
          restore-keys: rust-trexas-${{ runner.os }}-

      - name: Install trexas build dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Build trexas
        run: make configure && make debug_coverage
        working-directory: plugins/runtime

      - uses: actions/upload-artifact@v4
        with:
          name: ext-trexas
          path: plugins/runtime/build/debug/extension/trexas/trexas.trex
          retention-days: 1

  build-atlas:
    name: "Build atlas"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools plugins/atlas/circe-be"

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install circe build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev xxd maven

      - uses: actions/cache@v4
        with:
          path: |
            plugins/atlas/build
            plugins/atlas/circe-be/target
          key: circe-${{ runner.os }}-${{ hashFiles('plugins/atlas/CMakeLists.txt', 'plugins/atlas/extension_config.cmake', 'plugins/atlas/circe-be/pom.xml', 'plugins/atlas/graalvm-config/**') }}
          restore-keys: circe-${{ runner.os }}-

      - name: Build atlas
        run: make configure && make release
        working-directory: plugins/atlas

      - uses: actions/upload-artifact@v4
        with:
          name: ext-atlas
          path: plugins/atlas/build/release/extension/circe/circe.trex
          retention-days: 1

  build-ai:
    name: "Build ai"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools plugins/ai/llama.cpp"

      - name: Install ai build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev libvulkan1 libvulkan-dev vulkan-tools glslc libshaderc1 spirv-tools vulkan-validationlayers mesa-vulkan-drivers

      - uses: actions/cache@v4
        with:
          path: plugins/ai/build
          key: ai-cmake-${{ runner.os }}-${{ hashFiles('plugins/ai/CMakeLists.txt', 'plugins/ai/llama.cpp/CMakeLists.txt') }}
          restore-keys: ai-cmake-${{ runner.os }}-

      - name: Build ai
        run: make configure && make debug
        working-directory: plugins/ai

      - uses: actions/upload-artifact@v4
        with:
          name: ext-ai
          path: plugins/ai/build/debug/extension/ai/ai.trex
          retention-days: 1

  build-etl:
    name: "Build etl"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            plugins/etl/target
          key: rust-etl-${{ runner.os }}-${{ hashFiles('plugins/etl/Cargo.lock') }}
          restore-keys: rust-etl-${{ runner.os }}-

      - name: Build etl
        run: make configure && make debug_coverage
        working-directory: plugins/etl

      - uses: actions/upload-artifact@v4
        with:
          name: ext-etl
          path: plugins/etl/build/debug/extension/etl/etl.trex
          retention-days: 1
    
  build-migration:
    name: "Build migration"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/migration/target
          key: rust-migration-${{ runner.os }}-${{ hashFiles('plugins/migration/Cargo.lock') }}
          restore-keys: rust-migration-${{ runner.os }}-

      - name: Build migration
        run: make configure && make debug_coverage
        working-directory: plugins/migration

      - uses: actions/upload-artifact@v4
        with:
          name: ext-migration
          path: plugins/migration/build/debug/extension/migration/migration.trex
          retention-days: 1

  build-fhir:
    name: "Build fhir"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/extension-ci-tools"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/fhir/target
          key: rust-fhir-${{ runner.os }}-${{ hashFiles('plugins/fhir/Cargo.lock') }}
          restore-keys: rust-fhir-${{ runner.os }}-

      - name: Build fhir
        run: make configure && make debug_coverage
        working-directory: plugins/fhir

      - uses: actions/upload-artifact@v4
        with:
          name: ext-fhir
          path: plugins/fhir/build/debug/extension/fhir/fhir.trex
          retention-days: 1

  # ===========================================================================
  # Layer 2: Test Jobs
  # ===========================================================================

  test-distributed:
    name: "Test distributed (tier1/2/3)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-pool, build-rust-core]
    env:
      TREX_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/download-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/

      - uses: actions/download-artifact@v4
        with:
          name: ext-db
          path: plugins/db/build/debug/extension/db/

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run tier1 tests
        run: venv/bin/pytest -v test_tier1_single_node.py
        working-directory: integration-tests

      - name: Run tier2 tests
        run: venv/bin/pytest -v test_tier2_two_node.py
        working-directory: integration-tests

      - name: Run tier3 tests
        run: venv/bin/pytest -v test_tier3_aggregation.py
        working-directory: integration-tests

      - name: Merge coverage
        if: always()
        continue-on-error: true
        run: make coverage-merge
        working-directory: integration-tests

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: integration-tests/coverage/lcov
          flags: integration-distributed
          fail_ci_if_error: false

  test-pgwire:
    name: "Test pgwire"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-pool, build-rust-core, build-pgwire]
    env:
      TREX_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/download-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/

      - uses: actions/download-artifact@v4
        with:
          name: ext-db
          path: plugins/db/build/debug/extension/db/

      - uses: actions/download-artifact@v4
        with:
          name: ext-pgwire
          path: plugins/pgwire/build/debug/extension/pgwire/

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run pgwire standalone tests
        run: venv/bin/pytest -v test_pgwire_standalone.py
        working-directory: integration-tests

      - name: Run pgwire db tests
        run: venv/bin/pytest -v test_pgwire_db.py
        working-directory: integration-tests

      - name: Merge coverage
        if: always()
        continue-on-error: true
        run: make coverage-merge
        working-directory: integration-tests

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: integration-tests/coverage/lcov
          flags: integration-pgwire
          fail_ci_if_error: false

  test-atlas:
    name: "Test atlas"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-pool, build-atlas]
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/

      - uses: actions/download-artifact@v4
        with:
          name: ext-atlas
          path: plugins/atlas/build/release/extension/circe/

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run atlas standalone tests
        run: venv/bin/pytest -v test_atlas_standalone.py
        working-directory: integration-tests

  test-ai:
    name: "Test ai"
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    needs: [build-pool, build-ai]
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/

      - uses: actions/download-artifact@v4
        with:
          name: ext-ai
          path: plugins/ai/build/debug/extension/ai/

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run ai standalone tests
        run: venv/bin/pytest -v test_ai_standalone.py
        working-directory: integration-tests

  test-chdb:
    name: "Test chdb"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-pool, build-rust-core, build-chdb]
    env:
      TREX_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install chdb native library
        run: sudo bash ./install_chdb.sh
        working-directory: plugins/chdb

      - uses: actions/download-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/

      - uses: actions/download-artifact@v4
        with:
          name: ext-db
          path: plugins/db/build/debug/extension/db/

      - uses: actions/download-artifact@v4
        with:
          name: ext-chdb
          path: plugins/chdb/build/debug/extension/chdb/

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run chdb standalone tests
        run: venv/bin/pytest -v test_chdb_standalone.py
        working-directory: integration-tests

      - name: Run chdb db tests
        run: venv/bin/pytest -v test_chdb_db.py
        working-directory: integration-tests

      - name: Merge coverage
        if: always()
        continue-on-error: true
        run: make coverage-merge
        working-directory: integration-tests

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: integration-tests/coverage/lcov
          flags: integration-chdb
          fail_ci_if_error: false

  test-trexas:
    name: "Test trexas"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-pool, build-rust-core, build-trexas]
    env:
      TREX_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/download-artifact@v4
        with:
          name: ext-pool
          path: plugins/pool/build/debug/extension/pool/

      - uses: actions/download-artifact@v4
        with:
          name: ext-db
          path: plugins/db/build/debug/extension/db/

      - uses: actions/download-artifact@v4
        with:
          name: ext-trexas
          path: plugins/runtime/build/debug/extension/trexas/

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run trexas standalone tests
        run: venv/bin/pytest -v test_trexas_standalone.py
        working-directory: integration-tests

      - name: Run trexas swarm tests
        run: venv/bin/pytest -v test_trexas_swarm.py
        working-directory: integration-tests

      - name: Merge coverage
        if: always()
        continue-on-error: true
        run: make coverage-merge
        working-directory: integration-tests

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: integration-tests/coverage/lcov
          flags: integration-runtime
          fail_ci_if_error: false

