name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: integration-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Layer 1: Build (one matrix entry per plugin)
  # ===========================================================================
  #
  # Per-plugin overrides in matrix.include:
  #   dir              — plugins/{dir} (defaults to {plugin})
  #   target           — make target (defaults to debug_coverage)
  #   build-cmd        — full override of the build command
  #   tool             — extra toolchain to install: deno|graalvm|pgrx
  #   apt              — space-separated apt packages
  #   apt-pgdg         — true to register pgdg repo before apt-get install
  #   extra-submodules — extra submodule paths to init alongside extension-ci-tools
  #   pre-build        — shell command to run after apt+toolchain, before build
  #   pre-build-dir    — working-directory for pre-build
  #   artifact-name    — defaults to ext-{plugin}
  #   artifact         — full path to artifact (required)
  #   cache-paths      — newline-separated extra cache paths
  #   cache-lockfile   — single glob for hashFiles; defaults to plugins/{dir}/Cargo.lock
  #   timeout          — minutes, defaults to 20

  build:
    name: "Build ${{ matrix.plugin }}"
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 20 }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: pool
            artifact: plugins/pool/build/debug/extension/pool/pool.trex

          - plugin: db
            artifact: plugins/db/build/debug/extension/db/db.trex

          - plugin: pgwire
            artifact: plugins/pgwire/build/debug/extension/pgwire/pgwire.trex

          - plugin: chdb
            apt: libc6-dev clang
            pre-build: sudo bash ./install_chdb.sh
            pre-build-dir: plugins/chdb
            artifact: plugins/chdb/build/debug/extension/chdb/chdb.trex

          - plugin: hana
            artifact: plugins/hana/build/debug/extension/hana_scan/hana_scan.trex

          - plugin: tpm
            artifact: plugins/tpm/build/debug/extension/tpm/tpm.trex

          - plugin: trexas
            dir: runtime
            extra-submodules: plugins/runtime/trex-runtime
            tool: deno
            apt: libopenblas-dev
            # base's build.rs links libtrexsql since the startup snapshot
            # bakes in trex_core (trex-runtime#163); LD_LIBRARY_PATH because
            # the build script runs to create the snapshot
            libtrexsql: true
            build-cmd: export LIBRARY_PATH=/tmp/trexsql LD_LIBRARY_PATH=/tmp/trexsql && make configure && make debug_coverage
            artifact: plugins/runtime/build/debug/extension/trexas/trexas.trex
            timeout: 60

          - plugin: atlas
            target: release
            tool: graalvm
            apt: cmake libssl-dev xxd maven
            extra-submodules: plugins/atlas/circe-be
            artifact: plugins/atlas/build/release/extension/circe/circe.trex
            cache-paths: |
              plugins/atlas/build
              plugins/atlas/circe-be/target
            cache-lockfile: plugins/atlas/circe-be/pom.xml
            timeout: 30

          - plugin: ai
            target: debug
            apt: cmake libssl-dev libvulkan1 libvulkan-dev vulkan-tools glslc libshaderc1 spirv-tools vulkan-validationlayers mesa-vulkan-drivers
            extra-submodules: plugins/ai/llama.cpp
            artifact: plugins/ai/build/debug/extension/ai/ai.trex
            cache-paths: plugins/ai/build
            cache-lockfile: plugins/ai/llama.cpp/CMakeLists.txt
            timeout: 30

          - plugin: etl
            artifact: plugins/etl/build/debug/extension/etl/etl.trex

          - plugin: migration
            artifact: plugins/migration/build/debug/extension/migration/migration.trex

          - plugin: fhir
            artifact: plugins/fhir/build/debug/extension/fhir/fhir.trex

          - plugin: pg_trex
            tool: pgrx
            apt-pgdg: true
            apt: postgresql-17 postgresql-server-dev-17
            build-cmd: LIBRARY_PATH=/tmp/trexsql cargo build
            artifact-name: pg-trex-build
            artifact: plugins/pg_trex/target/debug/libpg_trex.so
            cache-paths: |
              ~/.pgrx
            timeout: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: plugins/extension-ci-tools ${{ matrix.extra-submodules }}

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.tool == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - if: matrix.tool == 'graalvm'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add pgdg apt repo
        if: matrix.apt-pgdg
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg

      - name: Install apt packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-libtrexsql
        if: matrix.tool == 'pgrx' || matrix.libtrexsql
        with:
          version: v1.4.4-trex

      - if: matrix.tool == 'pgrx'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-pgrx@0.16.1
      - name: pgrx init
        if: matrix.tool == 'pgrx'
        run: cargo pgrx init --pg17=$(which pg_config)

      - name: Pre-build step
        if: matrix.pre-build
        working-directory: ${{ matrix.pre-build-dir }}
        run: ${{ matrix.pre-build }}

      # Restore always, save only from develop/main -- see the note in
      # coverage.yml. PR-scoped cache writes were evicting the develop entries
      # every branch restores from, leaving `Build trexas` to compile cold for
      # ~21 min on every run.
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/${{ matrix.dir || matrix.plugin }}/target
            ${{ matrix.cache-paths }}
          key: build-${{ matrix.plugin }}-${{ runner.os }}-${{ hashFiles(matrix.cache-lockfile || format('plugins/{0}/Cargo.lock', matrix.dir || matrix.plugin)) }}
          restore-keys: build-${{ matrix.plugin }}-${{ runner.os }}-

      - name: Build
        working-directory: plugins/${{ matrix.dir || matrix.plugin }}
        run: ${{ matrix.build-cmd || format('make configure && make {0}', matrix.target || 'debug_coverage') }}

      - name: Save cargo cache
        if: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/${{ matrix.dir || matrix.plugin }}/target
            ${{ matrix.cache-paths }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name || format('ext-{0}', matrix.plugin) }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ===========================================================================
  # Layer 2: Test (one matrix entry per test suite)
  # ===========================================================================
  #
  # Per-entry overrides in matrix.include:
  #   name           — short id (also default for display + coverage flag suffix)
  #   display        — pretty name shown in the check (defaults to {name})
  #   exts           — space-separated extension names to download
  #   tests          — space-separated python test files to run
  #   coverage       — set to false to skip TREX_COVERAGE + codecov upload
  #   coverage-flags — codecov flags (defaults to integration-{name})
  #   pre-test       — shell command to run after extension downloads
  #   service-up     — shell command to start service container(s) before tests
  #   service-wait   — shell command to wait for service readiness
  #   service-down   — shell command to tear down services (runs always())
  #
  # pg_trex is intentionally NOT in this matrix — it has unique needs
  # (different artifact paths, extra submodules, packages: write) and
  # lives in its own job below.

  test:
    name: "Test ${{ matrix.display || matrix.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      TREX_COVERAGE: ${{ matrix.coverage != false && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: distributed
            display: "distributed (tier1/2/3)"
            exts: pool db
            tests: test_tier1_single_node.py test_tier2_two_node.py test_tier3_aggregation.py

          - name: pgwire
            exts: pool db pgwire
            tests: test_pgwire_standalone.py test_pgwire_db.py

          - name: atlas
            exts: pool atlas
            tests: test_atlas_standalone.py
            coverage: false

          - name: ai
            exts: pool ai
            tests: test_ai_standalone.py
            coverage: false

          - name: chdb
            exts: pool db chdb
            tests: test_chdb_standalone.py test_chdb_db.py
            pre-test: cd plugins/chdb && sudo bash ./install_chdb.sh

          - name: trexas
            exts: pool db trexas
            tests: test_trexas_standalone.py test_trexas_swarm.py
            coverage-flags: integration-runtime

          - name: tpm
            exts: pool tpm
            tests: test_tpm_standalone.py

          - name: etl
            exts: pool db etl
            tests: test_etl_standalone.py test_etl_db.py

          - name: migration
            exts: pool migration
            tests: test_migration_standalone.py

          - name: fhir
            exts: pool fhir
            tests: test_fhir_standalone.py

          - name: hana
            exts: pool hana
            tests: test_hana_standalone.py
            service-up: docker compose -f integration-tests/docker-compose.hana.yml up -d
            service-wait: |
              echo "Waiting for HANA Express to be fully ready..."
              for i in $(seq 1 120); do
                if docker logs trex-hana 2>&1 | grep -q "Startup finished!"; then
                  echo "HANA startup finished after ~$((i * 5))s"
                  sleep 5
                  exit 0
                fi
                sleep 5
              done
              echo "Timeout waiting for HANA (10 min)"
              docker logs trex-hana 2>&1 | tail -20
              exit 1
            service-down: docker compose -f integration-tests/docker-compose.hana.yml down -v
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Pre-test step
        if: matrix.pre-test
        run: ${{ matrix.pre-test }}

      # Per-extension downloads. Each step is a no-op when the matrix entry
      # doesn't list that extension. Cheaper than dynamic shell+gh-cli and
      # keeps artifact paths visible at a glance.
      - if: contains(matrix.exts, 'pool')
        uses: actions/download-artifact@v4
        with: { name: ext-pool,      path: plugins/pool/build/debug/extension/pool/ }
      - if: contains(matrix.exts, 'db')
        uses: actions/download-artifact@v4
        with: { name: ext-db,        path: plugins/db/build/debug/extension/db/ }
      - if: contains(matrix.exts, 'pgwire')
        uses: actions/download-artifact@v4
        with: { name: ext-pgwire,    path: plugins/pgwire/build/debug/extension/pgwire/ }
      - if: contains(matrix.exts, 'chdb')
        uses: actions/download-artifact@v4
        with: { name: ext-chdb,      path: plugins/chdb/build/debug/extension/chdb/ }
      - if: contains(matrix.exts, 'hana')
        uses: actions/download-artifact@v4
        with: { name: ext-hana,      path: plugins/hana/build/debug/extension/hana_scan/ }
      - if: contains(matrix.exts, 'tpm')
        uses: actions/download-artifact@v4
        with: { name: ext-tpm,       path: plugins/tpm/build/debug/extension/tpm/ }
      - if: contains(matrix.exts, 'trexas')
        uses: actions/download-artifact@v4
        with: { name: ext-trexas,    path: plugins/runtime/build/debug/extension/trexas/ }
      - if: contains(matrix.exts, 'atlas')
        uses: actions/download-artifact@v4
        with: { name: ext-atlas,     path: plugins/atlas/build/release/extension/circe/ }
      - if: contains(matrix.exts, 'ai')
        uses: actions/download-artifact@v4
        with: { name: ext-ai,        path: plugins/ai/build/debug/extension/ai/ }
      - if: contains(matrix.exts, 'etl')
        uses: actions/download-artifact@v4
        with: { name: ext-etl,       path: plugins/etl/build/debug/extension/etl/ }
      - if: contains(matrix.exts, 'migration')
        uses: actions/download-artifact@v4
        with: { name: ext-migration, path: plugins/migration/build/debug/extension/migration/ }
      - if: contains(matrix.exts, 'fhir')
        uses: actions/download-artifact@v4
        with: { name: ext-fhir,      path: plugins/fhir/build/debug/extension/fhir/ }

      - name: Start service
        if: matrix.service-up
        run: ${{ matrix.service-up }}

      - name: Wait for service
        if: matrix.service-wait
        run: ${{ matrix.service-wait }}

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run tests
        run: |
          for t in ${{ matrix.tests }}; do
            echo "::group::pytest $t"
            venv/bin/pytest -v "$t"
            echo "::endgroup::"
          done
        working-directory: integration-tests

      - name: Tear down service
        if: always() && matrix.service-down
        run: ${{ matrix.service-down }}

      - name: Merge coverage
        if: always() && matrix.coverage != false
        continue-on-error: true
        run: make coverage-merge
        working-directory: integration-tests

      - if: always() && matrix.coverage != false
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: integration-tests/coverage/lcov
          flags: ${{ matrix.coverage-flags || format('integration-{0}', matrix.name) }}
          fail_ci_if_error: false

  # pg_trex is the odd one out: extensions go to a flat `extensions/` dir
  # (the container expects them there), it pulls extra submodules used by
  # docker-compose.pg_trex.yml to build the test image, and it needs
  # packages: write. Easier to keep as a separate job than to special-case
  # the matrix.
  test-pg-trex:
    name: "Test pg_trex"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-trex
        with:
          paths: "plugins/pg-meta/postgres-meta plugins/studio/supabase-studio plugins/storage/supabase-storage"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with: { name: ext-pool,        path: extensions/ }
      - uses: actions/download-artifact@v4
        with: { name: ext-db,          path: extensions/ }
      - uses: actions/download-artifact@v4
        with: { name: pg-trex-build,   path: plugins/pg_trex/target/debug/ }

      - name: List pg_trex build context
        run: |
          ls -la plugins/pg_trex/target/debug/libpg_trex.so
          ls -la extensions/

      - name: Start pg_trex container
        run: docker compose -f integration-tests/docker-compose.pg_trex.yml up -d --build

      - name: Wait for pg_trex to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec trex-pg-trex pg_isready -U postgres 2>/dev/null; then
              echo "PostgreSQL ready after ~$((i * 2))s"
              sleep 5
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for PostgreSQL"
          docker logs trex-pg-trex 2>&1 | tail -30
          exit 1

      - name: Setup test environment
        run: make configure
        working-directory: integration-tests

      - name: Run pg_trex tests
        run: venv/bin/pytest -v test_pg_trex.py
        working-directory: integration-tests

      - name: Show pg_trex logs on failure
        if: failure()
        run: docker logs trex-pg-trex 2>&1 | tail -100

  # ===========================================================================
  # Layer 3: Status Gate
  # ===========================================================================

  integration-tests-status:
    name: "Integration Tests Status"
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build, test, test-pg-trex]
    steps:
      - name: Check results
        run: |
          echo "build:        ${{ needs.build.result }}"
          echo "test:         ${{ needs.test.result }}"
          echo "test-pg-trex: ${{ needs.test-pg-trex.result }}"
          if [[ "${{ needs.build.result }}" == "failure" ||
                "${{ needs.test.result }}" == "failure" ||
                "${{ needs.test-pg-trex.result }}" == "failure" ]]; then
            echo "::error::One or more integration test jobs failed"
            exit 1
          fi
          echo "All required integration tests passed (or were skipped/cancelled)"
