name: lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-with-retry
        with:
          submodule-paths: ''
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-with-retry
        with:
          submodule-paths: ''
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @biomejs/biome lint
