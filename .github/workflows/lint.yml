name: lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: co_checkout
        continue-on-error: true
      - if: steps.co_checkout.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @biomejs/biome lint
