[package]
name = "trexsql"
version = "0.1.0"
edition = "2021"

[lib]
name = "trexsql_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "trex"
path = "src/main.rs"

[dependencies]
duckdb = { git = "https://github.com/p-hoffmann/trexsql-rs", rev = "9d6d6fb" }
signal-hook = "0.3"
hex = "0.4"
serde_json = "1"
trex-pool-client = { path = "plugins/pool-client" }
arrow-array = "57"
arrow-schema = "57"

[profile.release]
lto = true
strip = true
