codecov:
  notify:
    require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 100%   # informational only, never fail
        informational: true
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unit-db
      carryforward: true
    - name: unit-fhir
      carryforward: true
    - name: unit-hana
      carryforward: true
    - name: unit-migration
      carryforward: true
    - name: unit-pg_trex
      carryforward: true
    - name: unit-pgt
      carryforward: true
    - name: unit-pgwire
      carryforward: true
    - name: unit-transform
      carryforward: true
    - name: integration-distributed
      carryforward: true
    - name: integration-pgwire
      carryforward: true
    - name: integration-etl
      carryforward: true
    - name: integration-fhir
      carryforward: true
    - name: integration-migration
      carryforward: true
    - name: integration-tpm
      carryforward: true

comment:
  layout: "header, diff, flags, components"
  require_changes: false
