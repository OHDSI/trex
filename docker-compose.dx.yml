# Standalone compose stack that runs trex + the devx plugin from a single
# pre-built image (ghcr.io/ohdsi/trexsql-dx) with the devx plugin and the
# devx_ext DuckDB extension baked in — NO local builds, bind-mounts, or
# submodule checkouts required. Runs alongside the default docker-compose.yml
# (ports offset by +1000 on HTTP / +20 on pg).
#
# The image is a single-node trex (Local DuckDB pool) so devx_ext command
# execution, the workspaces, and the function runtime are co-located.
#
# Run (pulls the published image):
#   docker compose -f docker-compose.dx.yml up -d
# UI: http://localhost:9001/plugins/trex/devx/
#
# Build the image locally instead of pulling (see Dockerfile.dx):
#   git submodule update --init plugins/extension-ci-tools
#   docker build -f Dockerfile.dx -t trexsql-dx:dev .
#   TREX_IMAGE=trexsql-dx:dev docker compose -f docker-compose.dx.yml up -d
#
# Init containers (one-shots, not builds):
#   - trex-init             — generates ./secrets/{root,derived}.env (the
#                             cryptographic keys trex needs; shared with the
#                             default stack so trex ↔ postgrest JWTs validate).
#   - devx-workspaces-init  — chowns the root-owned devx-workspaces volume to
#                             uid 1000 (`node`) so devx-api routes can write.
#
# Notes:
# - The dx image is multi-arch (arm64-native), so it runs natively rather than
#   under amd64 emulation.
# - Back up secrets/root.env — losing it invalidates every encrypted secret and
#   issued JWT.

# Distinct project name so this stack never collides with the default
# docker-compose.yml (which uses the directory-derived `trex` project).
# Container/volume/network names are all prefixed `trex-dx-`, letting both
# stacks run side by side without `-p` on the command line.
name: trex-dx

# Single-node setup: one `trex` node that is a data node (Local DuckDB pool) AND
# runs trexas (UI/API) + pgwire. Collapsing the former two-node data+server split
# keeps devx_ext command execution (npm, dev server, git, claude-code) on the same
# node as the workspace files, and makes every pool session Local — so there is no
# remote-session routing, no cross-node Flight dependency, and no create_session
# convergence window. `data_node:true` is what selects the Local pool backend.
x-swarm-config: &swarm-config
  SWARM_CONFIG: >-
    {"cluster_id":"local","nodes":{
      "trex":{
        "gossip_addr":"trex:4200","data_node":true,
        "extensions":[
          {"name":"flight","config":{"host":"0.0.0.0","port":50051}},
          {"name":"trexas","config":{"host":"0.0.0.0","port":8001,"main_service_path":"/usr/src/core/server","event_worker_path":"/usr/src/core/event","tls_port":8000,"tls_cert_path":"/usr/src/server.crt","tls_key_path":"/usr/src/server.key"}},
          {"name":"pgwire","config":{"host":"0.0.0.0","port":5432}}
        ]}
    }}

volumes:
  dx-pgdata:
  devx-workspaces:
  dx-claude-config:
  dx-gh-config:

services:
  # Generates ./secrets/{root,derived}.env on first boot (TREX_ROOT_KEY and the
  # derived JWT/crypto keys). Short-circuits if the files already exist.
  trex-init:
    image: ${TREX_IMAGE:-ghcr.io/ohdsi/trexsql-dx:latest}
    entrypoint: /usr/local/bin/trex-init
    environment:
      TREX_SECRETS_DIR: /shared
    volumes:
      - ./secrets:/shared
    restart: "no"

  postgres:
    image: postgres:16
    # No container_name — avoids clashing with the default compose's postgres.
    ports:
      - 65443:5432
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # Headroom for the DuckDB pool (TREX_POOL_SIZE=1024) plus postgrest,
      # the superuser reserve, and other clients. Must exceed the pool size.
      - -c
      - max_connections=1200
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
      POSTGRES_DB: testdb
    volumes:
      - dx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # devx-workspaces is created root-owned by Docker; trex runs as uid 1000
  # (`node`) and would hit EACCES on first mkdir inside it, surfacing as a
  # 500 from devx-api routes. This one-shot chowns the volume.
  devx-workspaces-init:
    image: alpine
    volumes:
      - devx-workspaces:/work
    command: ["sh", "-c", "chown 1000:1000 /work && echo '[devx-workspaces-init] done'"]
    restart: "no"

  # Single node — the DuckDB pool (Local), trexas (UI/API on 8001), pgwire, and
  # the devx plugin all live here. devx_ext command execution, the workspaces,
  # and the function runtime are co-located, so no remote sessions are involved.
  trex:
    image: ${TREX_IMAGE:-ghcr.io/ohdsi/trexsql-dx:latest}
    # Override with a local image for development:
    #   TREX_IMAGE=trexsql-test:dev docker compose -f docker-compose.dx.yml up -d
    # Ports offset by +1000 (HTTP) / +20 (pg) so this runs alongside the default
    # docker-compose.yml (which uses 8000/8001/5433). pgwire is on 5453 (not
    # 5443): 5443 is taken by an unrelated `sibyl-trex` container on this host.
    ports:
      - 9000:8000
      - 9001:8001
      - 5453:5432
    depends_on:
      trex-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      devx-workspaces-init:
        condition: service_completed_successfully
    env_file:
      - path: ./secrets/root.env
        required: false
      - path: ./secrets/derived.env
        required: false
    volumes:
      - dx-claude-config:/home/node/.claude
      - dx-gh-config:/home/node/.config/gh
      # The devx plugin and devx_ext extension are baked into the dx image, so
      # nothing source-related is mounted here — only persistent data volumes.
      - devx-workspaces:/tmp/devx-workspaces
    environment:
      <<: *swarm-config
      SWARM_NODE: trex
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-mypass}@postgres:5432/testdb
      # data_node runs the schema migrations (creates the `authenticator` role etc.)
      SCHEMA_DIR: /usr/src/core/schema
      TREX_PRODUCTION_MODE: ${TREX_PRODUCTION_MODE:-0}
      # Shared DuckDB session pool (pgwire + the function runtime's sql()).
      # Each pooled session that touches `_config.*` (devx.* tables, catalog
      # refresh) pins one real Postgres connection via the DuckDB postgres
      # extension. The three limits must move together:
      #   TREX_POOL_SIZE <= TREX_PG_CONNECTION_LIMIT <= Postgres max_connections
      # If the pool exceeds the pg limit, sessions race for too few Postgres
      # slots → "PostgresConnectionPool maximum connection count exceeded".
      # If the pg limit exceeds Postgres max_connections (set to 1200 in the
      # postgres service command), Postgres rejects with "too many clients".
      TREX_POOL_SIZE: ${TREX_POOL_SIZE:-1024}
      # Cap on real Postgres connections the pg extension opens per catalog.
      # Keep >= TREX_POOL_SIZE; extension default is 64.
      TREX_PG_CONNECTION_LIMIT: ${TREX_PG_CONNECTION_LIMIT:-1024}
      # Bound the lease wait so an exhausted pool fails the request instead of
      # blocking forever (requires the @trex/pool recv_timeout build to take effect).
      TREX_POOL_LEASE_TIMEOUT_MS: ${TREX_POOL_LEASE_TIMEOUT_MS:-30000}
      BASE_PATH: /trex
      BETTER_AUTH_URL: http://localhost:9001/trex
      # GitHub integration (devx → Connect GitHub) uses the OAuth Device Flow.
      # It defaults to the bundled "TREX" OAuth App client id (public; device
      # flow uses no secret), so Connect GitHub works with no setup. To point at
      # your own OAuth App instead — register one at
      # https://github.com/settings/developers with "Enable Device Flow" checked
      # — put GITHUB_CLIENT_ID=<id> in ./.env (compose auto-loads it). Unset
      # falls back to the bundled default in github_routes.ts.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # AES-256 key (64 hex chars) used to encrypt stored integration tokens
      # (devx → Connect GitHub). Supplied via ./.env. Without it, token
      # encrypt/decrypt is disabled and GitHub connect / private-repo clone fail
      # (public clone still works — the token lookup is best-effort).
      DEVX_ENCRYPTION_KEY: ${DEVX_ENCRYPTION_KEY:-}
      PLUGINS_INFORMATION_URL: "https://feeds.dev.azure.com/data2evidence/d2e/_apis/packaging/Feeds/d2e/packages?api-version=7.1&includeDescription=true"
      TPM_REGISTRY_URL: "https://pkgs.dev.azure.com/data2evidence/d2e/_packaging/d2e/npm/registry"
      PLUGINS_PATH: /usr/src/plugins
      PLUGINS_DEV_PATH: /usr/src/plugins-dev
      # REST is served in-process by the @trex/postgrest plugin (POSTGREST_MODE
      # defaults to "plugin"). These PGRST_* values mirror what the legacy
      # postgrest sidecar consumed; PGRST_JWT_SECRET comes from
      # ./secrets/derived.env (see env_file above).
      PGRST_DB_URI: postgres://authenticator:authenticator_pass@postgres:5432/testdb
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_PRE_REQUEST: public.postgrest_pre_request
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:9001/trex/rest/v1
      # Only used when POSTGREST_MODE=sidecar (legacy proxy to the postgrest
      # container below).
      POSTGREST_HOST: postgrest
      POSTGREST_PORT: "3000"
      # Register devx and prometheus in the web shell's top nav (consumed by plugins/web).
      TREX_WEB_NAV_EXTRA: '[{"path":"/devx","label":"DevX","plugin":"devx"},{"path":"/prometheus","label":"Prometheus","plugin":"prometheus"}]'
    healthcheck:
      # /trex/api/ready returns 200 only after auth keys are written to the DB,
      # which is a stronger readiness signal than auth/v1/health.
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://localhost:8001/trex/api/ready'').then(r => { if (r.status !== 200) throw new Error(r.status) })"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Legacy sidecar — REST is served in-process by the @trex/postgrest plugin
  # now. Only needed with POSTGREST_MODE=sidecar on trex:
  #   POSTGREST_MODE=sidecar docker compose -f docker-compose.dx.yml --profile postgrest-sidecar up
  postgrest:
    profiles: ["postgrest-sidecar"]
    image: postgrest/postgrest:v12.2.3
    # The `authenticator` role is created by trex's schema migrations, not by
    # postgres or trex-init. Gate on trex healthy (migrations done) and restart
    # as a safety net — postgrest exits 1 if the role isn't there yet.
    restart: unless-stopped
    depends_on:
      trex-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      trex:
        condition: service_healthy
    env_file:
      - path: ./secrets/derived.env
        required: false
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator_pass@postgres:5432/testdb
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # PGRST_JWT_SECRET comes from ./secrets/derived.env (see env_file above).
      PGRST_DB_PRE_REQUEST: public.postgrest_pre_request
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:9001/trex/rest/v1
