[package]
name = "pgwire"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` added alongside `cdylib` so integration tests in `tests/*.rs` can link
# against the library as a Rust crate. The cdylib is still produced for the
# DuckDB extension load path.
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "pgwire"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { git = "https://github.com/p-hoffmann/trexsql-rs", tag = "v1.4.4-trex", features = ["vtab-loadable", "vscalar", "vtab-arrow"] }
duckdb-loadable-macros = { git = "https://github.com/p-hoffmann/trexsql-rs", tag = "v1.4.4-trex" }
libduckdb-sys = { git = "https://github.com/p-hoffmann/trexsql-rs", tag = "v1.4.4-trex", features = ["loadable-extension"] }
pgwire = { version = "0.37.3", features = ["server-api-aws-lc-rs"] }
# Pinned to control feature set: rustls 0.23+ requires explicit CryptoProvider
# selection when multiple providers are pulled in transitively. The pgwire
# `server-api-aws-lc-rs` feature pulls aws-lc-rs while other transitive deps
# pull `ring`, so auto-selection panics on first TLS handshake. We install
# the `ring` provider explicitly via `ensure_crypto_provider()` in
# pgwire_server.rs (call it from any future TLS-enabling code path before
# the first handshake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.19", features = ["rt-multi-thread", "net", "macros", "time"] }
arrow-pg = "0.11.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
serde_json = "1.0"
base64 = "0.22"
rand = "0.8"
trex-pool-client = { path = "../pool-client" }

[dev-dependencies]
tokio-postgres = "0.7"
tempfile = "3"
rstest = "0.23"
